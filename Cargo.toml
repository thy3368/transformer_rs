[package]
name = "transformer_rs"
version.workspace = true
edition.workspace = true

[workspace]
members = ["crates/bpe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
bpe = { path = "crates/bpe" }

[dev-dependencies]
tempfile = "3"
rstest = "0.25"
